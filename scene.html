<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAHFID.AI — scene</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e8ecf4;--dim:#7c8598;--accent:#9db4ff}
  html,body{background:#050609;color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;overflow-x:hidden}
  #glcanvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1}
  #scroll-space{position:relative;z-index:2;height:600vh;pointer-events:none}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen}
  .hud-frame{position:absolute;inset:18px;border:1px solid rgba(157,180,255,.18)}
  .hud-corner{position:absolute;width:16px;height:16px;border:2px solid var(--accent);opacity:.7}
  .hud-corner.tl{top:12px;left:12px;border-right:0;border-bottom:0}
  .hud-corner.tr{top:12px;right:12px;border-left:0;border-bottom:0}
  .hud-corner.bl{bottom:12px;left:12px;border-right:0;border-top:0}
  .hud-corner.br{bottom:12px;right:12px;border-left:0;border-top:0}
  .hud-tl{position:absolute;top:30px;left:34px;font-size:11px;letter-spacing:.15em;color:var(--accent)}
  .hud-tr{position:absolute;top:30px;right:34px;font-size:11px;letter-spacing:.12em;color:var(--dim);text-align:right}
  .hud-bl{position:absolute;bottom:30px;left:34px;font-size:11px;color:var(--dim);letter-spacing:.1em}
  #progress-read{color:var(--accent)}
  .blink{animation:bk 1.1s step-end infinite}@keyframes bk{50%{opacity:0}}
  #poster-intro{position:fixed;inset:0;z-index:5;background:#050609 center/contain no-repeat;transition:opacity .6s;pointer-events:none}
  #poster-intro .enter{position:absolute;bottom:5vh;left:0;right:0;text-align:center;font-family:inherit;font-size:11px;letter-spacing:.35em;color:#9db4ff;opacity:.85}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="scroll-space"></div>
<div id="hud">
  <div class="hud-frame"></div>
  <span class="hud-corner tl"></span><span class="hud-corner tr"></span>
  <span class="hud-corner bl"></span><span class="hud-corner br"></span>
  <div class="hud-tl">&#9672; NAHFID.AI // ONBOARD INTELLIGENCE</div>
  <div class="hud-tr">SECTOR <span id="sector-read">00</span> / 05<br>NAV <span id="progress-read">0.00</span></div>
  <div class="hud-bl">scroll to fly <span class="blink">&#9656;</span></div>
</div>
<div id="poster-intro" style="background-image:url('assets/scene/poster-nahfid.png')"><div class="enter blink">SCROLL TO BOARD &#9662;</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function(){
  var canvas = document.getElementById('glcanvas');
  if(!window.THREE){ document.body.innerHTML='<p style="padding:2rem">WebGL required.</p>'; return; }

  var params = new URLSearchParams(location.search);
  var forcedT = params.has('t') ? Math.max(0, Math.min(1, parseFloat(params.get('t')))) : null;

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setClearColor(0x050609, 1);
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050609, 0.02);
  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 300);
  new THREE.TextureLoader().load('assets/scene/origin/corridor.png', function(tx){ scene.background = tx; });

  var Z_START = 12, Z_END = -88;
  var STATIONS = [
    { z:  4, label: 'AI CORE' },
    { z:-14, label: 'EXPERIENCE' },
    { z:-32, label: 'PROJECTS' },
    { z:-50, label: 'RESEARCH' },
    { z:-68, label: 'STACK' },
    { z:-84, label: 'CONTACT' }
  ];

  (function(){
    var n=650, pos=new Float32Array(n*3);
    for(var i=0;i<n;i++){ pos[i*3]=(Math.random()-0.5)*120; pos[i*3+1]=(Math.random()-0.5)*80; pos[i*3+2]=Z_END - Math.random()*40 + 20; }
    var g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x8fa4d8, size:0.13, transparent:true, opacity:.7 })));
  })();

  // ---- AI CORE: 3D particle face (depth-driven) ----
  (function(){
    var FVERT=[
      'uniform float uTime; uniform float uSize; uniform float uPR; uniform float uProg;',
      'attribute vec3 aColor; attribute float aRnd; attribute vec3 aStart;',
      'varying vec3 vColor; varying float vNear;',
      'void main(){',
      ' float p=clamp((uProg - aRnd*0.3)/0.7,0.0,1.0); p=p*p*(3.0-2.0*p);',
      ' vec3 pos=mix(aStart, position, p);',
      ' pos.x+=sin(uTime*0.6+aRnd*6.28)*0.02; pos.y+=cos(uTime*0.5+aRnd*6.28)*0.02;',
      ' vColor=aColor; vNear=smoothstep(-1.0,1.2,position.z);',
      ' vec4 mv=modelViewMatrix*vec4(pos,1.0);',
      ' gl_PointSize=uSize*uPR*(1.0/-mv.z);',
      ' gl_Position=projectionMatrix*mv;',
      '}'].join('\n');
    var FFRAG=[
      'precision mediump float; varying vec3 vColor; varying float vNear;',
      'void main(){ vec2 c=gl_PointCoord-0.5;',
      ' float a=1.0-smoothstep(0.40,0.5,max(abs(c.x),abs(c.y)));',
      ' vec3 tint=mix(vec3(0.30,0.45,0.75), vec3(0.80,0.90,1.0), vNear);',
      ' gl_FragColor=vec4(mix(vColor,tint,0.25)+vNear*0.05, a); }'].join('\n');
    var fu=null, fpts=null;
    function build(img, depth){
      var SW=132, SH=Math.round(SW*img.height/img.width);
      function samp(im){ var c=document.createElement('canvas'); c.width=SW;c.height=SH; var x=c.getContext('2d'); x.drawImage(im,0,0,SW,SH); return x.getImageData(0,0,SW,SH).data; }
      var cd=samp(img), dd=samp(depth);
      var FACE_W=8.0, scale=FACE_W/SW, DEPTH=2.2, T=46;
      var tp=[],cl=[],st=[],rn=[];
      for(var iy=0;iy<SH;iy++)for(var ix=0;ix<SW;ix++){
        var i=(iy*SW+ix)*4, dv=dd[i]; if(dv<T) continue;
        tp.push((ix-SW/2)*scale,(SH/2-iy)*scale,(dv/255-0.5)*DEPTH);
        cl.push(cd[i]/255,cd[i+1]/255,cd[i+2]/255);
        st.push((Math.random()-0.5)*22,(Math.random()-0.5)*22,10+Math.random()*20);
        rn.push(Math.random());
      }
      var g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(tp),3));
      g.setAttribute('aStart',new THREE.BufferAttribute(new Float32Array(st),3));
      g.setAttribute('aColor',new THREE.BufferAttribute(new Float32Array(cl),3));
      g.setAttribute('aRnd',new THREE.BufferAttribute(new Float32Array(rn),1));
      fu={uTime:{value:0},uSize:{value:22.0},uPR:{value:Math.min(window.devicePixelRatio||1,2)},uProg:{value:(forcedT!==null?1:0)}};
      fpts=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:fu,vertexShader:FVERT,fragmentShader:FFRAG,transparent:true,depthWrite:false,depthTest:false}));
      fpts.position.set(0,0.5,2);
      scene.add(fpts);
      window.__facePts=fpts; window.__faceU=fu;
    }
    var a=new Image(), b=new Image(), n=0;
    function rdy(){ if(++n===2){ try{ build(a,b); }catch(e){} } }
    a.onload=rdy; b.onload=rdy; a.src='assets/profile.png'; b.src='assets/profile-depth.png';
  })();

  new THREE.TextureLoader().load('assets/scene/origin/core-chamber.png', function(tx){
    var g=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,depthWrite:false}));
    g.scale.set(15,15,1); g.position.set(0,0.5,1.4); scene.add(g);
  });
  function labelSprite(text){
    var c=document.createElement('canvas'); c.width=512; c.height=128;
    var x=c.getContext('2d'); x.textAlign='center'; x.textBaseline='middle';
    x.font='700 60px Inter, system-ui, sans-serif'; x.fillStyle='#e8ecf4'; x.fillText(text, 256, 64);
    var t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter;
    var s=new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthWrite:false }));
    s.scale.set(9, 2.25, 1); return s;
  }

  function frameLine(w,h,color,op){
    var hw=w/2,hh=h/2;
    var pts=[new THREE.Vector3(-hw,-hh,0),new THREE.Vector3(hw,-hh,0),new THREE.Vector3(hw,hh,0),new THREE.Vector3(-hw,hh,0),new THREE.Vector3(-hw,-hh,0)];
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:color,transparent:true,opacity:op}));
  }
  STATIONS.forEach(function(st,i){
    var f=frameLine(13,7.4, i===0?0x9db4ff:0x415072, .85); f.position.set(0,0,st.z); scene.add(f);
    var f2=frameLine(11,5.8, 0x283149, .5); f2.position.set(0,0,st.z); scene.add(f2);
    var lab=labelSprite(st.label); lab.position.set(0, 4.7, st.z); scene.add(lab);
    st.ring=f;
  });

  function applyProgress(p){
    document.getElementById('progress-read').textContent = p.toFixed(2);
    var z = Z_START + (Z_END - Z_START) * p;
    camera.position.z = z;
    camera.position.x = Math.sin(p * Math.PI * 3) * 2.4;
    camera.position.y = Math.cos(p * Math.PI * 2) * 1.4;
    camera.lookAt(0, 0, z - 12);
    var sec = 0, best = 1e9;
    for(var i=0;i<STATIONS.length;i++){ var dd = Math.abs(STATIONS[i].z - z); if(dd < best){ best = dd; sec = i; } }
    document.getElementById('sector-read').textContent = ('0'+sec).slice(-2);
  }

  function resize(){ var w=window.innerWidth, h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  var progress = forcedT !== null ? forcedT : 0;
  var lenis = null;
  if(forcedT === null && window.Lenis){
    lenis = new Lenis({ lerp:0.08, smoothWheel:true });
    lenis.on('scroll', function(e){ progress = e.progress; });
    function lraf(t){ lenis.raf(t); requestAnimationFrame(lraf); } requestAnimationFrame(lraf);
  } else if(forcedT === null){
    window.addEventListener('scroll', function(){ var max=document.documentElement.scrollHeight-window.innerHeight; progress=max>0?window.scrollY/max:0; }, {passive:true});
  }

  var t0 = performance.now();
  function loop(){
    var tm=(performance.now()-t0)/1000;
    if(window.__faceU){ window.__faceU.uTime.value=tm; window.__faceU.uProg.value=Math.min(window.__faceU.uProg.value+0.01,1);
      if(window.__facePts){ window.__facePts.rotation.y=Math.sin(tm*0.3)*0.28; } }
    var pin=document.getElementById('poster-intro'); if(pin){ pin.style.opacity=Math.max(0,1-progress/0.05); }
    applyProgress(progress);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
  window.__scene = { applyProgress: applyProgress, stations: STATIONS };
})();
</script>
</body>
</html>
